# CI: на каждый push и pull request GitHub поднимает PostgreSQL и прогоняет все тесты.
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    # отдельный контейнер с PostgreSQL рядом с раннером — та же версия, что в docker-compose
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cbr_test
        ports:
          - 5432:5432
        # ждём, пока база реально начнёт принимать подключения, а не просто запустится
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/cbr_test
      # config.py требует PG_DSN при импорте. Рабочей базы в CI нет — указываем тестовую.
      PG_DSN: postgresql://postgres:postgres@localhost:5432/cbr_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
