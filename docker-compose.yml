services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev_local_only
      POSTGRES_DB: cbrdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # при ПЕРВОМ запуске (пустой том) образ выполнит эти файлы по алфавиту и создаст схему
      - ./sql/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata: